<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسار · منصة الحقائب التدريبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFCF3;--card:#FFFFFF;--ink:#1F2A37;--body:#3F4A57;--mute:#6B7280;
  --navy:#123E6B;--gold:#C9971F;--gsoft:#FBF1D6;--teal:#0E7C8C;--soft:#E8F4F3;--line:#EADFC8;--th:#F6F1E4;
  --ok:#1E8E5A;--oksoft:#E5F5EC;--no:#C2412D;--nosoft:#FBEAE6;--shadow:0 6px 24px rgba(18,62,107,.08);
  --pa:#123E6B;--pd:#123E6B;--ps:#E8F4F3;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1722;--card:#17212E;--ink:#F2EDE1;--body:#C9CFD6;--mute:#8F98A3;
  --navy:#8DBBEA;--gold:#E2B64A;--gsoft:#3A3015;--teal:#4CC3CF;--soft:#14313A;--line:#2C3A4A;--th:#1E2A38;
  --ok:#4CC38A;--oksoft:#143326;--no:#F07A64;--nosoft:#3A1F1A;--shadow:0 6px 24px rgba(0,0,0,.3);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1722;--card:#17212E;--ink:#F2EDE1;--body:#C9CFD6;--mute:#8F98A3;
  --navy:#8DBBEA;--gold:#E2B64A;--gsoft:#3A3015;--teal:#4CC3CF;--soft:#14313A;--line:#2C3A4A;--th:#1E2A38;
  --ok:#4CC38A;--oksoft:#143326;--no:#F07A64;--nosoft:#3A1F1A;--shadow:0 6px 24px rgba(0,0,0,.3);
  color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--body);font-family:"Amiri","Traditional Arabic","Times New Roman",serif;font-size:19px;line-height:1.85}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
a{color:inherit}
button{font:inherit;cursor:pointer}
img{max-width:100%}
h1,h2,h3{color:var(--ink);line-height:1.35;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}

/* الرأس */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:38px;height:38px}
.brand b{font-size:28px;color:var(--navy);line-height:1}
.brand small{display:block;font-size:13px;color:var(--mute);line-height:1.2}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{text-decoration:none;font-weight:700;font-size:17px;color:var(--body);padding:6px 14px;border-radius:999px}
.nav a.on{background:var(--navy);color:var(--card)}
.who{display:flex;align-items:center;gap:8px}
.av{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#1F2A37;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}

/* الأزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:9px 20px;font-weight:700;font-size:18px;text-decoration:none;line-height:1.4}
.btn.p{background:var(--pa);color:#fff}
.btn.g{background:var(--gold);color:#1F2A37}
.btn.s{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.l{background:transparent;color:var(--pa);padding:6px 10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:20px;height:20px}

/* بطاقات عامة */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.pad{padding:22px}
.muted{color:var(--mute)}
.pill{display:inline-block;font-size:14px;font-weight:700;border-radius:999px;padding:1px 12px;background:var(--ps);color:var(--pa)}
.sec{margin:34px 0}
.sec>h2{font-size:28px;margin-bottom:14px}

/* الرئيسية */
.hero{padding:44px 0 18px;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
.hero h1{font-size:50px;line-height:1.25}
.hero p{font-size:21px;margin:12px 0 22px;max-width:34em}
.hero .road{position:relative;height:230px}
.hero .road svg{width:100%;height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.pk{overflow:hidden;display:flex;flex-direction:column;text-decoration:none}
.pk .cv{aspect-ratio:16/9;background:var(--pd);position:relative;display:flex;align-items:center;justify-content:center}
.pk .cv img{width:100%;height:100%;object-fit:cover;display:block}
.pk .cv .gen{color:#fff;text-align:center;padding:16px}
.pk .cv .gen b{display:block;font-size:30px}
.pk .in{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.pk h3{font-size:24px}
.pk .meta{display:flex;gap:10px;align-items:center;margin-top:auto;padding-top:8px;font-size:16px}
.pk .price{margin-inline-start:auto;font-weight:700;color:var(--pa);font-size:20px}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.why .card{padding:16px 18px}
.why b{display:block;color:var(--ink);font-size:19px}

/* صفحة الحقيبة */
.lp{display:grid;grid-template-columns:1fr 360px;gap:28px;padding:30px 0}
.lp h1{font-size:44px}
.lp .tag{font-size:22px;color:var(--pa);font-weight:700;margin:4px 0 10px}
.buy{position:sticky;top:90px;overflow:hidden}
.buy .cv img{display:block;width:100%}
.buy .in{padding:18px}
.buy .pr{font-size:34px;font-weight:700;color:var(--ink)}
.buy .btn{width:100%;margin-top:10px}
.gets{list-style:none;padding:0;margin:10px 0 0}
.gets li{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.gets li::before{content:"✓";color:var(--pa);font-weight:700}
.ul{counter-reset:u;display:flex;flex-direction:column;gap:10px}
.ul .u{display:flex;gap:14px;align-items:flex-start;padding:14px 16px}
.num{flex:none;width:42px;height:42px;border-radius:50%;background:var(--ps);color:var(--pa);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px}
.ul .u b{color:var(--ink);font-size:20px;display:block}
.ul .u small{display:block;color:var(--mute);font-size:16px}
.certprev{border-radius:14px;border:1px solid var(--line);display:block}
.codebox{display:none;margin-top:10px}
.codebox.on{display:flex;gap:8px}
.codebox input{flex:1;min-width:0}

/* النماذج */
input[type=text],input[type=email],select{font:inherit;font-size:18px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
label.f{display:block;font-weight:700;color:var(--ink);margin:12px 0 4px}
.auth{max-width:440px;margin:50px auto;padding:28px}
.auth h1{font-size:32px}
.otp{display:flex;gap:8px;direction:ltr;justify-content:center;margin:14px 0}
.otp input{width:48px;height:56px;text-align:center;font-size:26px;padding:0}

/* حقائبي */
.mine{display:flex;flex-direction:column;gap:14px}
.mi{display:grid;grid-template-columns:200px 1fr auto;gap:18px;align-items:center;overflow:hidden}
.mi .cv{height:100%;min-height:112px;background:var(--pd)}
.mi .cv img{width:100%;height:100%;object-fit:cover;display:block}
.mi .in{padding:14px 0}
.mi .go{padding:0 18px}
.bar{height:10px;border-radius:999px;background:var(--th);overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--pa);border-radius:999px;transition:width .4s}

/* المشغّل */
.pl{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;padding:20px 0 40px}
.pl>*{min-width:0}
.side{position:sticky;top:86px;align-self:start;padding:14px}
.side h3{font-size:20px;margin-bottom:2px}
.side .bar{margin-bottom:12px}
.ulist{display:flex;flex-direction:column;gap:6px}
.ui{display:flex;gap:10px;align-items:center;border:1.5px solid transparent;background:transparent;border-radius:14px;padding:8px 10px;text-align:right;width:100%;color:var(--body)}
.ui .num{width:36px;height:36px;font-size:17px}
.ui b{display:block;font-size:17px;color:var(--ink);line-height:1.4}
.ui small{display:block;font-size:14px;color:var(--mute);line-height:1.3}
.ui.cur{border-color:var(--pa);background:var(--ps)}
.ui.done .num{background:var(--pa);color:#fff}
.ui.lock{opacity:.55;cursor:not-allowed}
.main{min-width:0}
.uh{padding:18px 20px;margin-bottom:14px}
.uh .k{color:var(--pa);font-weight:700;font-size:16px}
.uh h2{font-size:30px}
.qo2{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;font-size:17px}
.qo2 span b{color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 16px;font-weight:700;font-size:17px;display:inline-flex;gap:6px;align-items:center}
.tabs button svg{width:18px;height:18px}
.tabs button.on{background:var(--pa);border-color:var(--pa);color:#fff}
.vid{aspect-ratio:16/9;border-radius:18px;background:radial-gradient(120% 120% at 70% 20%,#3a3a5c 0%,var(--pd) 60%);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff}
.vid .play{width:86px;height:86px;border-radius:50%;background:var(--pa);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 12px rgba(255,255,255,.08)}
.vid .play svg{width:38px;height:38px;margin-inline-start:-6px}
.vid .cap{position:absolute;bottom:0;inset-inline:0;padding:14px 18px;background:linear-gradient(transparent,rgba(0,0,0,.55));display:flex;justify-content:space-between;align-items:end}
.vid .cap b{font-size:20px}
.vid .cap small{opacity:.8}
.note{font-size:15px;color:var(--mute);margin-top:8px}
.pdfv{padding:12px}
.pdfv .tb{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pdfv .tb b{color:var(--ink)}
.pdfv .pages{display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto;background:var(--th);border-radius:12px;padding:10px}
.pdfv .pages img{display:block;width:100%;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.ph{aspect-ratio:1.414;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#9aa1a9}
.txt{padding:20px 22px}
.txt p{margin:0 0 12px}
.txt .lk{display:inline-flex;align-items:center;gap:6px;color:var(--pa);font-weight:700;text-decoration:underline;text-underline-offset:4px;background:none;border:0;padding:0}
.quiz{padding:18px 20px}
.qset{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qset span{font-size:15px;background:var(--th);border-radius:999px;padding:0 12px}
.qz{padding:12px 0;border-bottom:1px dashed var(--line)}
.qz:last-of-type{border-bottom:0}
.qz>b{color:var(--ink);display:block;margin-bottom:6px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qopts button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;text-align:right;font-size:17px;line-height:1.5}
.qopts button.sel{border-color:var(--pa);background:var(--ps)}
.qopts button.ok{border-color:var(--ok);background:var(--oksoft)}
.qopts button.no{border-color:var(--no);background:var(--nosoft)}
.qbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.res{margin-top:14px;padding:14px 16px;border-radius:14px;font-weight:700}
.res.ok{background:var(--oksoft);color:var(--ok)}
.res.no{background:var(--nosoft);color:var(--no)}
.done-card{padding:24px;text-align:center;margin-top:14px;border:2px solid var(--gold);background:var(--gsoft)}
.done-card h2{font-size:28px}

/* الشهادة */
.cwrap{padding:24px 0 40px}
.cert canvas{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line)}
.crow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.vcode{font-family:ui-monospace,Menlo,monospace;direction:ltr;display:inline-block;background:var(--th);border-radius:8px;padding:0 10px}
.verify{max-width:560px;margin:50px auto;padding:28px;text-align:center}
.seal{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:40px}
.seal.ok{background:var(--oksoft);color:var(--ok)} .seal.no{background:var(--nosoft);color:var(--no)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;text-align:right;margin-top:14px}
.kv dt{color:var(--mute)} .kv dd{margin:0;color:var(--ink);font-weight:700}

/* لوحة المدرب */
.adm{padding:24px 0 40px}
.adm h1{font-size:36px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:16px 0}
.stat{padding:16px 18px}
.stat b{display:block;font-size:36px;color:var(--ink);line-height:1.2}
.stat span{color:var(--mute);font-size:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{color:var(--mute);font-weight:700;font-size:15px;background:var(--th)}
td .bar{width:120px;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:2px 14px;font-size:16px}
.chips button.on{background:var(--navy);border-color:var(--navy);color:var(--card)}
.set{display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set b{color:var(--ink)}
.codes{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.codes div{display:flex;justify-content:space-between;align-items:center;background:var(--th);border-radius:10px;padding:4px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* شريط التجربة والتنبيهات */
.demo{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 10px;display:flex;gap:6px;align-items:center;font-size:15px;box-shadow:var(--shadow)}
.demo b{padding:0 6px}
.demo button{border:0;border-radius:10px;padding:2px 10px;background:rgba(255,255,255,.14);color:var(--bg);font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:14px;z-index:50;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{border-top:1px solid var(--line);margin-top:40px;padding:20px 0 30px;color:var(--mute);font-size:15px}
.bnav{display:none}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding-top:26px}
  .hero h1{font-size:38px}
  .hero .road{display:none}
  .lp{grid-template-columns:1fr}
  .buy{position:static;order:-1}
  .lp h1{font-size:34px}
  .pl{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .ulist{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .ui{flex:none;width:auto;min-width:150px}
  .ui small{display:none}
  .qopts{grid-template-columns:1fr}
  .mi{grid-template-columns:1fr}
  .mi .cv{min-height:0;aspect-ratio:16/9}
  .mi .in,.mi .go{padding:0 16px 16px}
  .two{grid-template-columns:1fr}
  .nav{display:none}
  .bnav{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav a{flex:1;text-align:center;text-decoration:none;font-size:14px;font-weight:700;color:var(--mute);display:flex;flex-direction:column;align-items:center;line-height:1.4}
  .bnav a svg{width:24px;height:24px}
  .bnav a.on{color:var(--navy)}
  body{padding-bottom:70px}
  .demo{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .uh h2{font-size:25px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/">
    <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#123E6B"/><circle cx="33" cy="15" r="6" fill="#E2B64A"/><path d="M8 40 C 18 34, 16 26, 26 24 S 36 20, 33 15" fill="none" stroke="#E2B64A" stroke-width="3.2" stroke-linecap="round"/></svg>
    <span><b>مسار</b><small>منصة الحقائب التدريبية</small></span>
  </a>
  <nav class="nav" id="nav"></nav>
  <div class="who" id="who"></div>
</div></header>

<main id="app"></main>
<nav class="bnav" id="bnav"></nav>

function shuffle(a){ const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function quiz(p){
  const u = PL.unit, key = p.slug + ":" + u, el = $("#pane");
  const set = S.settings, maxA = set.attempts, used = S.att[key] || 0, passed = done(p.slug).includes(u);
  const bank = (QUIZ[u - 1] || QUIZ[0]).map((q, i) => ({ ...q, i, o2: q.o.map((t, j) => ({ t, j })) }));
  const qs = set.shuffle ? shuffle(bank).map(q => ({ ...q, o2: shuffle(q.o2) })) : bank;
  const left = maxA === 0 ? "بلا حد" : Math.max(0, maxA - used);
  const head = `<div class="qset"><span>نسبة النجاح ${set.pass}%</span><span>المحاولات المتبقية: ${left}</span>${set.shuffle ? "<span>الأسئلة مخلوطة</span>" : ""}</div>`;
  if (passed) { el.innerHTML = `<div class="card quiz">${head}<div class="res ok">اجتزت امتحان هذه الوحدة. ${u < p.units.length ? "الوحدة التالية مفتوحة." : ""}</div>${u < p.units.length ? `<div class="qbar"><button class="btn p" id="nx">الوحدة ${ORD[u]}</button></div>` : ""}</div>`; const nx = $("#nx"); if (nx) nx.onclick = () => { PL.unit = u + 1; PL.tab = "video"; location.hash = "#/learn/" + p.slug + "/" + (u + 1); }; return; }
  if (maxA !== 0 && used >= maxA) { el.innerHTML = `<div class="card quiz">${head}<div class="res no">انتهت محاولاتك في هذه الوحدة. راسل المدرب ليفتح لك محاولة جديدة.</div></div>`; return; }
  const sel = {};
  el.innerHTML = `<div class="card quiz">${head}<p class="muted" style="margin:0">اختر إجابة لكل سؤال، ثم اضغط «أرسل الإجابات».</p>
    ${qs.map((q, k) => `<div class="qz" data-k="${k}"><b>${k + 1}. ${esc(q.q)}</b><div class="qopts">${q.o2.map(o => `<button data-j="${o.j}">${esc(o.t)}</button>`).join("")}</div></div>`).join("")}
    <div class="qbar"><button class="btn p" id="qsend" disabled>أرسل الإجابات (0 من ${qs.length})</button></div><div id="qres"></div></div>`;
  el.querySelectorAll(".qz").forEach(z => z.querySelectorAll("button").forEach(b => b.onclick = () => {
    z.querySelectorAll("button").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); sel[z.dataset.k] = +b.dataset.j;
    const c = Object.keys(sel).length; const s = $("#qsend"); s.disabled = c < qs.length; s.textContent = `أرسل الإجابات (${c} من ${qs.length})`;
  }));
  $("#qsend").onclick = () => {
    /* في المنصة الفعلية تُرسل الإجابات إلى الخادم، وهو وحده يعرف الصحيح منها */
    let right = 0;
    qs.forEach((q, k) => {
      const z = el.querySelector(`.qz[data-k="${k}"]`);
      z.querySelectorAll("button").forEach(b => { b.disabled = true; const j = +b.dataset.j; if (j === sel[k] && j === q.a) b.classList.add("ok"); else if (j === sel[k]) b.classList.add("no"); b.classList.remove("sel"); });
      if (sel[k] === q.a) right++;
    });
    S.att[key] = used + 1;
    const score = Math.round(right / qs.length * 100), ok = score >= set.pass;
    if (ok) { S.prog[p.slug] = [...new Set([...done(p.slug), u])].sort((a, b) => a - b); }
    save();
    $("#qsend").remove();
    $("#qres").innerHTML = `<div class="res ${ok ? "ok" : "no"}">${ok ? "نجحت" : "لم تصل إلى النسبة المطلوبة"}: ${right} من ${qs.length} (${score}%).</div>
      <div class="qbar">${ok ? (u < p.units.length ? `<button class="btn p" id="nx">انتقل إلى الوحدة ${ORD[u]}</button>` : `<a class="btn g" href="#/cert/${p.slug}">اعرض شهادتي</a>`) : `<button class="btn s" id="again">أعد المحاولة</button>`}</div>`;
    if (ok && done(p.slug).length === p.units.length) issueCert(p);
    const nx = $("#nx"); if (nx) nx.onclick = () => { PL.tab = "video"; location.hash = "#/learn/" + p.slug + "/" + (u + 1); };
    const ag = $("#again"); if (ag) ag.onclick = () => quiz(p);
    refreshSide(p);
  };
}

    <h1 style="font-size:34px">شهادتك</h1><p class="muted">صدرت تلقائيًا باسمك، ولا تحتاج مراجعة من أحد.</p>
    <div class="card cert pad"><canvas id="cv" width="2000" height="1414"></canvas>
      <div class="crow"><button class="btn p" id="cdl">${I.dl}تنزيل الشهادة</button><a class="btn s" href="#/verify/${c.code}">صفحة التحقق</a>
      <span class="muted">رقم التحقق: <span class="vcode">${c.code}</span></span></div></div>
  </div></div>${foot()}`;
}
async function drawCert(slug){
  const c = S.certs[slug], cv = $("#cv"); if (!c || !cv) return;
  const x = cv.getContext("2d"), img = new Image();
  try { await document.fonts.load("700 80px Amiri"); await document.fonts.load("400 40px Amiri"); } catch(e) {}
  img.onload = () => {
    x.drawImage(img, 0, 0, 2000, 1414);
    x.direction = "rtl"; x.fillStyle = "#1B1B2F";
    x.textAlign = "center"; x.font = "700 84px Amiri, serif"; x.fillText(c.name, 1000, 640);
    x.textAlign = "right"; x.font = "400 42px Amiri, serif"; x.fillText(fmtDate(new Date(c.date)), 985, 908);
    x.textAlign = "left"; x.direction = "ltr"; x.fillStyle = "#6B7280"; x.font = "400 28px Amiri, serif"; x.fillText(c.code, 120, 1330);
  };
  img.src = IMG.cert;
  $("#cdl").onclick = () => toast("في المنصة الفعلية تنزل الشهادة صورة عالية الدقة وملفًا للطباعة.");
}
function vVerify(code){
  const hit = Object.entries(S.certs).find(([, c]) => c.code === code);
  if (!hit) return `<div class="wrap"><div class="card verify"><div class="seal no">✕</div><h1>رقم غير موجود</h1><p class="muted">تأكد من رقم التحقق المكتوب أسفل الشهادة.</p></div></div>`;
  const [slug, c] = hit, p = pk(slug);
  return `<div class="wrap"><div class="card verify"><div class="seal ok">✓</div><h1>شهادة صحيحة</h1><p class="muted">هذه الشهادة صادرة من منصة مسار.</p>
    <dl class="kv"><dt>الاسم</dt><dd>${esc(c.name)}</dd><dt>الحقيبة</dt><dd>${p.name}</dd><dt>تاريخ الإصدار</dt><dd>${fmtDate(new Date(c.date))}</dd><dt>رقم التحقق</dt><dd><span class="vcode">${c.code}</span></dd></dl></div></div>`;
}

/* لوحة المدرب */
let AT = "over";
const FAKE = [
  ["سارة الهاشمي","video",6,"—"],["محمد العلي","video",4,"الصورة"],["نورة الكعبي","video",2,"الصوت"],["خالد المنصوري","video",1,"النص"],
  ["ريم الشامسي","video",6,"—"],["عبدالله الظاهري","video",3,"الصورة"],["فاطمة النعيمي","video",0,"البطاقة"],["يوسف الحمادي","video",5,"التحقق"]
];
function trainees(){
  const rows = FAKE.map(r => ({ name:r[0], slug:r[1], n:r[2], stuck:r[3], via:"كود" }));
  if (S.user && S.enroll.video) rows.unshift({ name:S.user.name + " (أنت)", slug:"video", n:done("video").length, stuck: done("video").length === 6 ? "—" : (pk("video").units[done("video").length] || {}).title || "—", via:"كود" });
  S.granted.forEach(g => rows.unshift({ name:g, slug:"video", n:0, stuck:"لم يبدأ", via:"منح يدوي" }));
  return rows;
}
function vAdmin(){
  const rows = trainees(), total = rows.length, fin = rows.filter(r => r.n === 6).length;
  const avg = Math.round(rows.reduce((a, r) => a + r.n / 6, 0) / total * 100);
  const tabs = [["over","نظرة عامة"],["people","المتدربون"],["access","منح الوصول"],["exam","إعدادات الامتحانات"]];
  let body = "";
  if (AT === "over") body = `<div class="stats">
      <div class="card stat"><b>${total}</b><span>متدربًا في حقيبة الفيديو</span></div>
      <div class="card stat"><b>${fin}</b><span>أنهوا الحقيبة</span></div>
      <div class="card stat"><b>${avg}%</b><span>متوسط الإنجاز</span></div>
      <div class="card stat"><b>الصورة</b><span>أكثر وحدة يتوقف عندها المتدربون</span></div></div>
      <div class="card pad"><h3>أين يتوقف المتدربون</h3>${pk("video").units.map(u => { const c = rows.filter(r => r.n === u.n - 1).length; return `<div style="display:grid;grid-template-columns:170px 1fr 40px;gap:10px;align-items:center;margin-top:8px;--pa:#D62828"><span>${u.title.split(":")[0]}</span><div class="bar" style="margin:0"><i style="width:${c / total * 100}%"></i></div><b>${c}</b></div>`; }).join("")}</div>`;
  if (AT === "people") body = `<div class="card tw"><table><tr><th>المتدرب</th><th>الحقيبة</th><th>الإنجاز</th><th>يقف عند</th><th>الوصول</th></tr>${rows.map(r => `<tr><td><b style="color:var(--ink)">${esc(r.name)}</b></td><td>${pk(r.slug).name}</td><td style="--pa:#D62828"><div style="display:flex;gap:8px;align-items:center"><div class="bar"><i style="width:${r.n / 6 * 100}%"></i></div>${r.n}/6</div></td><td>${esc(r.stuck)}</td><td>${r.via}</td></tr>`).join("")}</table></div>`;
  if (AT === "access") body = `<div class="two">
      <div class="card pad"><h3>منح وصول يدوي</h3><p class="muted">يصل المتدرب بريد بالدخول، وتظهر الحقيبة في «حقائبي».</p>
        <label class="f" for="gem">بريد المتدرب</label><input type="email" id="gem" dir="ltr" placeholder="name@example.com">
        <label class="f">الحقيبة</label><div class="chips"><button class="on">مسار الفيديو</button><button disabled>مسار الذكاء الاصطناعي</button></div>
        <button class="btn g" id="grant" style="margin-top:14px">امنح الوصول</button></div>
      <div class="card pad"><h3>أكواد الوصول</h3><p class="muted">كود يُعطى لمجموعة، بعدد استخدام ومدة.</p>
        <label class="f">عدد الأكواد</label><div class="chips" data-g="n">${[1,5,10,20].map((v, i) => `<button data-v="${v}" class="${i === 1 ? "on" : ""}">${v}</button>`).join("")}</div>
        <label class="f">الاستخدام لكل كود</label><div class="chips" data-g="u">${["مرة واحدة","5 مرات","بلا حد"].map((v, i) => `<button data-v="${v}" class="${i === 0 ? "on" : ""}">${v}</button>`).join("")}</div>
        <label class="f">ينتهي بعد</label><div class="chips" data-g="e">${["أسبوع","شهر","3 أشهر","بلا انتهاء"].map((v, i) => `<button data-v="${v}" class="${i === 1 ? "on" : ""}">${v}</button>`).join("")}</div>
        <button class="btn p" id="gen" style="margin-top:14px;--pa:#123E6B">ولّد الأكواد</button><div class="codes" id="codes"></div></div></div>`;
  if (AT === "exam") body = `<div class="card pad"><h3>إعدادات امتحانات «مسار الفيديو»</h3><p class="muted">تُطبَّق فورًا على المشغّل. جرّبها ثم افتح الامتحان.</p>
      <div class="set"><div><b>عدد المحاولات</b><div class="muted">بعدها يحتاج المتدرب فتح محاولة من المدرب</div></div><div class="chips" data-s="attempts">${[[1,"1"],[2,"2"],[3,"3"],[5,"5"],[0,"بلا حد"]].map(v => `<button data-v="${v[0]}" class="${S.settings.attempts === v[0] ? "on" : ""}">${v[1]}</button>`).join("")}</div></div>
      <div class="set"><div><b>نسبة النجاح</b></div><div class="chips" data-s="pass">${[60,70,80,90,100].map(v => `<button data-v="${v}" class="${S.settings.pass === v ? "on" : ""}">${v}%</button>`).join("")}</div></div>
      <div class="set"><div><b>خلط الأسئلة والخيارات</b></div><div class="chips" data-s="shuffle">${[[1,"نعم"],[0,"لا"]].map(v => `<button data-v="${v[0]}" class="${+S.settings.shuffle === v[0] ? "on" : ""}">${v[1]}</button>`).join("")}</div></div>
      <div class="set"><div><b>فتح محاولات جديدة لك</b><div class="muted">يصفّر محاولاتك في كل الوحدات</div></div><button class="btn s" id="resetAtt">صفّر المحاولات</button></div></div>`;
  return `<div class="wrap adm"><h1>لوحة المدرب</h1><p class="muted">المتدربون وتقدّمهم، ومنح الوصول، وإعدادات الامتحانات. البيانات هنا أمثلة للعرض.</p>
    <div class="tabs" id="atabs" style="margin-top:14px;--pa:#123E6B">${tabs.map(t => `<button data-t="${t[0]}" class="${AT === t[0] ? "on" : ""}">${t[1]}</button>`).join("")}</div>${body}</div>${foot()}`;
}
function bindAdmin(){
  document.querySelectorAll("#atabs button").forEach(b => b.onclick = () => { AT = b.dataset.t; render(); });
  document.querySelectorAll(".chips[data-g] button, .chips[data-s] button").forEach(b => b.onclick = () => {
    b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    const s = b.parentElement.dataset.s;
    if (s) { S.settings[s] = s === "shuffle" ? !!+b.dataset.v : +b.dataset.v; save(); toast("حُفظ الإعداد"); }
  });
  const g = $("#grant"); if (g) g.onclick = () => { const e = $("#gem").value.trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { toast("اكتب بريدًا صحيحًا"); return; } S.granted.push(e); save(); toast("مُنح الوصول، وأُرسل بريد الدخول"); $("#gem").value = ""; };
  const gn = $("#gen"); if (gn) gn.onclick = () => {
    const pick = k => $(`.chips[data-g="${k}"] .on`).dataset.v;
    const n = +pick("n"), u = pick("u"), e = pick("e");
    $("#codes").innerHTML = Array.from({length:n}, () => `<div><span class="vcode">MSR-${Math.floor(1000 + Math.random() * 9000)}</span><small class="muted">${u} · ${e}</small></div>`).join("");
  };
  const r = $("#resetAtt"); if (r) r.onclick = () => { S.att = {}; save(); toast("صُفّرت المحاولات"); };
}

/* شريط التجربة */
function demoBar(slug){ return `<div class="demo"><b>تجربة</b><button data-d="all">أنهِ الوحدات</button><button data-d="reset">ابدأ من الصفر</button></div>`; }
function bindDemo(slug){
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => {
    const p = pk(slug);
    if (b.dataset.d === "all") { S.prog[slug] = p.units.map(u => u.n); issueCert(p); save(); toast("أُنهيت الوحدات، والشهادة صدرت"); render(); }
    else { S.prog[slug] = []; S.att = {}; delete S.certs[slug]; save(); PL = { unit:1, tab:"video" }; toast("بدأت التجربة من الصفر"); location.hash = "#/learn/" + slug + "/1"; render(); }
  });
}

/* التوجيه */
function render(){
  const parts = location.hash.replace(/^#\/?/, "").split("?")[0].split("/");
  const r = parts[0] || "";
  chrome(r);
  let html = "", after = null;
  if (r === "") html = vHome();
  else if (r === "p") { html = vLanding(parts[1]); after = () => bindLanding(parts[1]); }
  else if (r === "login") { html = vLogin(); after = bindLogin; }
  else if (r === "my") html = vMy();
  else if (r === "learn") { if (parts[2]) PL.unit = +parts[2]; html = vLearn(parts[1], parts[2]); after = () => bindLearn(parts[1]); }
  else if (r === "cert") { html = vCert(parts[1]); after = () => drawCert(parts[1]); }
  else if (r === "verify") html = vVerify(parts[1]);
  else if (r === "admin") { html = vAdmin(); after = bindAdmin; }
  else html = vHome();
  $("#app").innerHTML = html;
  if (after) after();
}
let lastRoute = "";
addEventListener("hashchange", () => { const r = location.hash.split("/").slice(0, 2).join("/"); if (r !== lastRoute) scrollTo(0, 0); lastRoute = r; render(); });
render();
</script>
</body>
</html>
