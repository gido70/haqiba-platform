<title>الحقيبة · منصة الحقائب التدريبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F0;--card:#FFFFFF;--ink:#18231F;--body:#3B4742;--mute:#76827C;
  --brand:#0F5C4A;--brand2:#0A3F33;--acc:#C2693A;--bsoft:#E3F0EB;--asoft:#F8E9DF;--line:#E4DED1;--th:#F2EEE4;
  --ok:#1F7A4D;--oksoft:#E2F3E9;--no:#B4402A;--nosoft:#F8E5DF;
  --shadow:0 10px 30px rgba(10,63,51,.08);--lift:0 18px 40px rgba(10,63,51,.14);
  --pa:var(--brand);--pd:var(--brand2);--ps:var(--bsoft);
  --serif:"Amiri","Traditional Arabic","Times New Roman",serif;
  --fa:"Noto Nastaliq Urdu","Amiri",serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1714;--card:#16221E;--ink:#EEF2EC;--body:#C3CDC7;--mute:#8C9892;
  --brand:#3DBB98;--brand2:#9BE0CB;--acc:#E79A6C;--bsoft:#123A30;--asoft:#3A2618;--line:#26342F;--th:#1B2925;
  --ok:#5CC08A;--oksoft:#163222;--no:#F08A70;--nosoft:#3A1F18;--shadow:0 10px 30px rgba(0,0,0,.35);--lift:0 18px 40px rgba(0,0,0,.45);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1714;--card:#16221E;--ink:#EEF2EC;--body:#C3CDC7;--mute:#8C9892;
  --brand:#3DBB98;--brand2:#9BE0CB;--acc:#E79A6C;--bsoft:#123A30;--asoft:#3A2618;--line:#26342F;--th:#1B2925;
  --ok:#5CC08A;--oksoft:#163222;--no:#F08A70;--nosoft:#3A1F18;--shadow:0 10px 30px rgba(0,0,0,.35);--lift:0 18px 40px rgba(0,0,0,.45);
  color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--serif);font-size:21px;line-height:1.9;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
a{color:inherit}
button{font:inherit;cursor:pointer}
img{max-width:100%}
h1,h2,h3{color:var(--ink);line-height:1.45;margin:0;font-family:var(--serif);font-weight:700}
html[lang="ar"] .fa{font-family:var(--fa);font-weight:400;line-height:2.3;letter-spacing:0}
html[lang="ar"] .fa,html[lang="ar"] .nav a,html[lang="ar"] .tabs button,html[lang="ar"] .space button span,html[lang="ar"] .bnav a{word-spacing:.28em}
html[lang="ar"] .sec>h2.fa{font-size:30px}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}

/* الحركة */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#app>*{animation:rise .35s ease-out both}
.card,.btn,.tabs button,.ui,.chips button,.lang,.nav a{transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease,color .2s ease,border-color .2s ease}
a.card:hover,.lift:hover{transform:translateY(-4px);box-shadow:var(--lift)}
.btn:active,.tabs button:active,.chips button:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* أيقونات ثلاثية الأبعاد */
.ic3{flex:none;width:52px;height:52px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;color:#fff;position:relative;
  background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.55),rgba(255,255,255,0) 46%),linear-gradient(150deg,var(--c1,#1E8A6E),var(--c2,#0A3F33));
  box-shadow:inset -3px -5px 9px rgba(0,0,0,.22),inset 3px 3px 7px rgba(255,255,255,.35),0 10px 18px -6px var(--c2,#0A3F33)}
.ic3 svg{width:26px;height:26px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.ic3.s{width:38px;height:38px;border-radius:12px}.ic3.s svg{width:20px;height:20px}
.ic3.copper{--c1:#E0905F;--c2:#8E4320}.ic3.sand{--c1:#E8C27A;--c2:#9A6A1E}.ic3.plum{--c1:#9B6BB0;--c2:#4B2A5C}.ic3.sky{--c1:#5AA7D6;--c2:#1D4F78}

/* الرأس */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{background:var(--card)}
.top .wrap{display:flex;align-items:center;gap:18px;height:72px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .ic3{width:44px;height:44px;border-radius:14px}
.brand b{font-size:30px;color:var(--ink);line-height:1.1;display:block}
html[lang="ar"] .brand b{font-family:var(--fa);font-weight:400;font-size:24px;line-height:1.2}
html[lang="ar"] .brand small{margin-top:17px}
.brand small{display:block;font-size:15px;color:var(--mute);line-height:1.2}
.nav{display:flex;gap:4px}
.nav a{text-decoration:none;font-size:19px;color:var(--body);padding:4px 16px;border-radius:999px}
html[lang="ar"] .nav a{font-family:var(--fa);line-height:2.2;padding:0 16px}
.nav a:hover{background:var(--th)}
.nav a.on{background:var(--bsoft);color:var(--brand)}
.who{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.lang{display:inline-flex;align-items:center;gap:6px;min-height:40px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:0 14px;font-size:17px;font-weight:700}
.lang svg{width:18px;height:18px}
.av{width:42px;height:42px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.5),transparent 50%),linear-gradient(150deg,#E0905F,#8E4320);box-shadow:inset -2px -3px 6px rgba(0,0,0,.2),0 6px 12px -4px #8E4320}

/* الأزرار والروابط */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:0;border-radius:14px;padding:6px 22px;font-weight:700;font-size:20px;text-decoration:none;line-height:1.4}
.btn.p,.btn.g{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 55%),var(--pa);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -8px var(--pa)}
.btn.g{--pa:var(--brand)}
.btn.c{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 55%),var(--acc);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -8px var(--acc)}
.btn.s{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.s:hover{border-color:var(--pa);color:var(--pa)}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn svg{width:20px;height:20px}
.lk,.txt a{display:inline-flex;align-items:center;gap:6px;color:var(--pa);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;background:none;border:0;padding:0 2px;border-radius:6px}
.lk:hover,.txt a:hover{background:var(--ps)}
.lk svg{width:18px;height:18px}

/* بطاقات عامة */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.pad{padding:22px}
.muted{color:var(--mute)}
.pill{display:inline-block;font-size:17px;font-weight:700;border-radius:999px;padding:0 12px;background:var(--ps);color:var(--pa)}
.sec{margin:38px 0}
.sec>h2{font-size:30px;margin-bottom:14px}

/* الرئيسية */
.hero{padding:44px 0 18px;display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center}
.hero h1{font-size:52px;line-height:1.35}
.hero p{font-size:22px;margin:12px 0 24px;max-width:32em}
.hero .art svg{width:100%;height:auto;display:block;filter:drop-shadow(0 24px 30px rgba(10,63,51,.18))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.pk{overflow:hidden;display:flex;flex-direction:column;text-decoration:none}
.pk .cv{aspect-ratio:16/9;background:var(--pd);position:relative;display:flex;align-items:center;justify-content:center}
.pk .cv img{width:100%;height:100%;object-fit:cover;display:block}
.pk .cv .gen{color:#fff;text-align:center;padding:16px}
.pk .cv .gen b{display:block;font-size:30px}
.pk .in{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.pk h3{font-size:25px}
.pk .meta{display:flex;gap:10px;align-items:center;margin-top:auto;padding-top:8px;font-size:18px}
.pk .price{margin-inline-start:auto;font-weight:700;color:var(--pa);font-size:21px}
.group{display:flex;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.group a.gl{display:inline-flex;align-items:center;gap:10px;border-radius:14px;padding:2px 14px 2px 6px;font-weight:700;background:var(--card);border:1.5px solid var(--line);color:var(--ink);text-decoration:none}
.group a.gl:hover{border-color:var(--brand)}
.group a.gl .ic3{width:34px;height:34px;border-radius:10px}
.group p{margin:0;color:var(--mute)}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.why .card{padding:18px 20px}
.why .ic3{margin-bottom:10px}
.why b{display:block;color:var(--ink);font-size:21px}

/* صفحة المجموعة */
.gban{position:relative;overflow:hidden;border-radius:26px;padding:34px 30px;color:#fff;margin-top:24px;
  background:radial-gradient(120% 140% at 85% 0%,#1D4F78 0%,#123E6B 45%,#0B2747 100%);box-shadow:var(--lift)}
.gban::after{content:"";position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(226,182,74,.45),transparent 65%)}
.gban h1{color:#fff;font-size:44px}
.gban p{max-width:36em;margin:6px 0 0;opacity:.9}
.gban .pill{background:rgba(255,255,255,.16);color:#fff}
.gstats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}
.gstats .card{padding:16px;text-align:center}
.gstats b{display:block;font-size:34px;color:var(--ink);line-height:1.3}
.gstats span{color:var(--mute);font-size:17px}
.gabout{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.who-card{display:flex;gap:14px;align-items:center}

/* صفحة الحقيبة */
.lp{display:grid;grid-template-columns:1fr 370px;gap:28px;padding:30px 0}
.lp h1{font-size:46px}
.lp .tag{font-size:23px;color:var(--pa);font-weight:700;margin:4px 0 10px}
.buy{position:sticky;top:96px;overflow:hidden}
.buy .cv img{display:block;width:100%}
.buy .in{padding:18px}
.buy .pr{font-size:36px;font-weight:700;color:var(--ink)}
.buy .btn{width:100%;margin-top:10px}
.gets{list-style:none;padding:0;margin:10px 0 0}
.gets li{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.gets li::before{content:"✓";color:var(--pa);font-weight:700}
.ul{display:flex;flex-direction:column;gap:10px}
.ul .u{display:flex;gap:14px;align-items:flex-start;padding:14px 16px}
.num{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ps);color:var(--pa);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px}
.ul .u b{color:var(--ink);font-size:21px;display:block}
.ul .u small{display:block;color:var(--mute);font-size:18px}
.certprev{border-radius:14px;border:1px solid var(--line);display:block}
.codebox{display:none;margin-top:10px}
.codebox.on{display:flex;gap:8px}
.codebox input{flex:1;min-width:0}

/* النماذج */
input[type=text],input[type=email],select{font:inherit;font-size:20px;min-height:48px;padding:6px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:100%}
input:focus{outline:2px solid var(--brand);outline-offset:1px}
label.f{display:block;font-weight:700;color:var(--ink);margin:12px 0 4px}
.auth{max-width:460px;margin:50px auto;padding:28px}
.auth h1{font-size:34px}
.otp{display:flex;gap:8px;direction:ltr;justify-content:center;margin:14px 0}
.otp input{width:50px;height:58px;text-align:center;font-size:26px;padding:0}

/* حقائبي */
.mine{display:flex;flex-direction:column;gap:14px}
.mi{display:grid;grid-template-columns:210px 1fr auto;gap:18px;align-items:center;overflow:hidden}
.mi .cv{height:100%;min-height:116px;background:var(--pd)}
.mi .cv img{width:100%;height:100%;object-fit:cover;display:block}
.mi .in{padding:14px 0}
.mi .go{padding:0 18px}
.bar{height:10px;border-radius:999px;background:var(--th);overflow:hidden;margin:8px 0 2px;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.bar i{display:block;height:100%;background:linear-gradient(180deg,rgba(255,255,255,.3),transparent),var(--pa);border-radius:999px;transition:width .5s}

/* مساحة الحقيبة */
.space{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.space::-webkit-scrollbar{display:none}
.space button{flex:none;display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:4px 16px 4px 6px;font-size:20px}
html[lang="ar"] .space button span{font-family:var(--fa);line-height:2.2}
html[dir="ltr"] .space button{padding:4px 6px 4px 16px}
.space button.on{border-color:var(--pa);background:var(--ps);color:var(--pa);box-shadow:0 8px 18px -10px var(--pa)}
.space .cnt{font-size:15px;font-weight:700;background:var(--acc);color:#fff;border-radius:999px;padding:0 8px;line-height:1.6}

/* المشغّل */
.pl{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;padding:14px 0 40px}
.pl>*{min-width:0}
.side{position:sticky;top:92px;align-self:start;padding:14px}
.side h3{font-size:21px;margin-bottom:2px}
.ulist{display:flex;flex-direction:column;gap:6px}
.ui{display:flex;gap:10px;align-items:center;min-height:52px;border:1.5px solid transparent;background:transparent;border-radius:16px;padding:6px 10px;text-align:start;width:100%;color:var(--body)}
.ui:hover{background:var(--th)}
.ui .num{width:38px;height:38px;font-size:18px}
.ui b{display:block;font-size:19px;color:var(--ink);line-height:1.45}
.ui small{display:block;font-size:16px;color:var(--mute);line-height:1.3}
.ui.cur{border-color:var(--pa);background:var(--ps)}
.ui.done .num{background:var(--pa);color:#fff;box-shadow:inset -2px -3px 5px rgba(0,0,0,.2),inset 2px 2px 4px rgba(255,255,255,.3)}
.ui.lock{opacity:.55;cursor:not-allowed}
.uh{padding:18px 20px;margin-bottom:14px}
.uh .k{color:var(--pa);font-weight:700;font-size:18px}
.uh h2{font-size:31px}
.qo2{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;font-size:19px}
.qo2 span b{color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{min-height:44px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:0 16px;font-size:19px;display:inline-flex;gap:6px;align-items:center}
html[lang="ar"] .tabs button{font-family:var(--fa);line-height:2.1}
.tabs button svg{width:18px;height:18px}
.tabs button.on{background:var(--pa);border-color:var(--pa);color:#fff;box-shadow:0 8px 18px -10px var(--pa)}
.vid{aspect-ratio:16/9;border-radius:20px;background:radial-gradient(120% 120% at 70% 20%,#3a3a5c 0%,var(--pd) 60%);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;box-shadow:var(--lift)}
.vid .play{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 32% 25%,rgba(255,255,255,.5),transparent 50%),var(--pa);box-shadow:inset -4px -6px 12px rgba(0,0,0,.3),0 0 0 12px rgba(255,255,255,.08),0 16px 30px -8px rgba(0,0,0,.6);transition:transform .25s}
.vid:hover .play{transform:scale(1.07)}
.vid .play svg{width:38px;height:38px;margin-inline-start:-6px}
html[dir="ltr"] .vid .play svg{margin-inline-start:6px}
.vid .cap{position:absolute;bottom:0;inset-inline:0;padding:14px 18px;background:linear-gradient(transparent,rgba(0,0,0,.55));display:flex;justify-content:space-between;align-items:end}
.vid .cap b{font-size:21px}
.vid .cap small{opacity:.85}
.note{font-size:17px;color:var(--mute);margin-top:8px}
.pdfv{padding:12px}
.pdfv .tb{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pdfv .tb b{color:var(--ink)}
.pdfv .pages{display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto;background:var(--th);border-radius:14px;padding:10px}
.pdfv .pages img{display:block;width:100%;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.ph{aspect-ratio:1.414;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#9aa1a9}
.txt{padding:20px 22px}
.txt p{margin:0 0 12px}
.quiz{padding:18px 20px}
.qset{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qset span{font-size:17px;background:var(--th);border-radius:999px;padding:0 12px}
.qz{background:var(--ps);border:1px solid var(--line);border-inline-start:6px solid color-mix(in srgb,var(--pa) 35%,transparent);border-radius:20px;padding:16px 18px 18px;margin:16px 0;transition:border-color .2s,background-color .2s}
.qz.ans{border-inline-start-color:var(--pa)}
.qz.right{border-inline-start-color:var(--ok);background:color-mix(in srgb,var(--oksoft) 60%,var(--card))}
.qz.wrong{border-inline-start-color:var(--no);background:color-mix(in srgb,var(--nosoft) 60%,var(--card))}
.qh{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.qh b{color:var(--ink);font-size:23px;line-height:1.7;font-weight:700}
.qn{flex:none;width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:19px;margin-top:4px;

  lastUid = session.user.id;
  await onSession(session);

async function syncSession(){
  try { const { data } = await sb.auth.getSession(); const uid = data.session && data.session.user && data.session.user.id;
    if (uid && uid !== (S.user && S.user.id)) await afterSignIn(data.session);
    else if (!uid && S.user) { lastUid = null; await onSession(null); render(); } } catch (e) {}

        return `<tr><td>${esc(tx((kit(kid) || {}).name))}</td><td>${+un ? L("الوحدة","Unit") + " " + un : L("الحقيبة كلها","Whole kit")}</td><td><b style="color:var(--acc)">${avg ? "★ " + avg.toFixed(1) : "—"}</b></td><td>${arr.length}</td></tr>`; }).join("");
      el.innerHTML = `<div class="card tw" style="margin-bottom:16px"><table><tr><th>${L("الحقيبة","Kit")}</th><th>${L("الجزء","Part")}</th><th>${L("متوسط التقييم","Average rating")}</th><th>${L("عدد الآراء","Responses")}</th></tr>${summary}</table></div>
        <div class="feed">${data.map(f => `<article class="card post"><div class="hd"><span class="ic3 s plum">${I.star}</span><div><b>${esc(f.name || f.email || "—")} · <span style="color:var(--acc)">${f.rating ? "★".repeat(f.rating) : "—"}</span></b><small>${esc(tx((kit(f.kit_id) || {}).name))}${f.unit_n ? " · " + L("الوحدة","Unit") + " " + f.unit_n : " · " + L("الحقيبة كلها","Whole kit")} · ${fmtDate(f.created_at)}</small></div></div>${f.note ? `<p>${esc(f.note)}</p>` : ""}</article>`).join("")}</div>`;
    } else if (AT === "index" || AT === "guide") {
      const { data, error } = await sb.from("hq_docs").select("body,updated_at").eq("id", AT).maybeSingle(); if (error) throw error;
      if (!data) { el.innerHTML = `<p class="muted">${L("لا إندكس محفوظ بعد.","No index saved yet.")}</p>`; return; }
      const X = data.body; let it = 0;
      const draw = () => {
        const q = ($("#idxQ") && $("#idxQ").value.trim()) || "";
        const pool = q ? X.tabs.flatMap(t => t.items.map(i => ({ ...i, tab: t.t }))) : X.tabs[it].items;
        const items = pool.filter(i => !q || (i.h + i.b).includes(q));
        $("#idxList").innerHTML = items.map(i => `<details class="card post" style="padding:0"><summary style="cursor:pointer;padding:14px 18px;display:flex;gap:10px;align-items:baseline;list-style:none"><b style="color:var(--ink)">${i.h}</b>${i.st ? `<span class="st ${i.st === "done" ? "okk" : i.st === "now" ? "rev" : "none"}">${{ done:"منجز", now:"جارٍ", next:"قادم" }[i.st]}</span>` : ""}<small class="muted" style="margin-inline-start:auto">${i.tab ? i.tab + " · " : ""}${i.d || ""}</small></summary><div style="padding:0 18px 14px">${i.b}</div></details>`).join("") || `<p class="muted">لا نتائج.</p>`;
        document.querySelectorAll("#idxTabs button").forEach((b, j) => b.classList.toggle("on", j === it && !q));
      };
      el.innerHTML = `<div class="card pad" style="border-inline-start:6px solid var(--acc);margin-bottom:14px"><small class="muted">الإصدار ${esc(X.version)} · ${L("آخر تحديث","Last updated")}: ${fmtDate(data.updated_at)}</small><h3 style="font-size:24px;margin-top:4px">▶ ${X.now.title}</h3><p style="margin:6px 0 0">${X.now.detail}</p></div>
        <div class="road-mini" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">${X.road.map(r => `<div class="card" style="flex:1;min-width:150px;padding:10px 14px;${r.s === "done" ? "background:var(--brand);color:#fff" : r.s === "now" ? "background:var(--asoft);border-color:var(--acc)" : ""}"><small style="display:block;opacity:.8">${r.n}${r.s === "done" ? " ✓" : r.s === "now" ? " ◀" : ""}</small><b>${r.t}</b></div>`).join("")}</div>
        <div class="tabs" id="idxTabs">${X.tabs.map((t, j) => `<button data-i="${j}">${t.t} (${t.items.length})</button>`).join("")}</div>
        <input type="text" id="idxQ" placeholder="${L("ابحث في الإندكس","Search the index")}" style="margin-bottom:12px"><div class="feed" id="idxList"></div>`;
      document.querySelectorAll("#idxTabs button").forEach(b => b.onclick = () => { it = +b.dataset.i; $("#idxQ").value = ""; draw(); });
      $("#idxQ").oninput = draw; draw();
    }
  } catch (e) { el.innerHTML = `<div class="card pad res no">${errMsg(e)}</div>`; }
}
function bindAdmin(){
  document.querySelectorAll("#atabs button").forEach(b => b.onclick = () => { AT = b.dataset.t; render(); });
  const al = $("#asLearnerBtn"); if (al) al.onclick = () => setAsLearner(true);
  const cp = $("#copyLink"); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText($("#shareLink").textContent); toast(L("نُسخ الرابط","Link copied")); } catch (e) { toast($("#shareLink").textContent); } };
  adminBody(); }

/* التوجيه */
/* تنبيه بوجود تحديث جديد للمنصة */
const BUILD = "20261019045922";
async function checkUpdate(){
  try { const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) return; const v = await r.json();
    if (v.build && v.build !== BUILD && !$("#upd")) { const d = document.createElement("div"); d.id = "upd"; d.className = "toast on"; d.style.pointerEvents = "auto"; d.style.cursor = "pointer";
      d.innerHTML = L("يوجد تحديث جديد للمنصة · اضغط هنا للتحديث","A new version is available · tap to refresh"); d.onclick = () => location.reload(); document.body.appendChild(d); } } catch (e) {}
}
setInterval(checkUpdate, 120000); document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
let renderSeq = 0;
async function render(){
  const seq = ++renderSeq; applyLang();
  const parts = location.hash.replace(/^#\/?/, "").split("?")[0].split("/"); const r = parts[0] || "";
  chrome(r);
  if (!S.ready) { $("#app").innerHTML = spinner(); return; }
  if (S.user && S.profile && !S.profile.name && r !== "login") { try { sessionStorage.setItem("hq-next", parts.join("/") || "my"); } catch (e) {} $("#app").innerHTML = vName(); bindName(); return; }
  let html = "", after = null;
  try {
    if (r === "") html = vHome();
    else if (r === "g") html = await vGroup(parts[1]);
    else if (r === "p") { html = await vLanding(parts[1]); after = () => bindLanding(parts[1]); }
    else if (r === "login") { html = vLogin(); after = bindLogin; }
    else if (r === "my") html = await vMy();
    else if (r === "learn") { html = await vLearn(parts[1], parts[2]); after = () => bindLearn(parts[1]); }
    else if (r === "cert") { html = await vCert(parts[1]); after = () => bindCert(parts[1]); }
    else if (r === "verify") html = await vVerify(parts[1]);
    else if (r === "admin") { html = await vAdmin(); after = bindAdmin; }
    else html = vHome();
  } catch (e) { console.error(e); html = `<div class="wrap"><div class="card auth" style="text-align:center"><div class="res no">${errMsg(e)}</div><button class="btn g" style="margin-top:14px" onclick="location.reload()">${L("تحديث الصفحة","Refresh page")}</button></div></div>`; }
  if (seq !== renderSeq) return;
  $("#app").innerHTML = html; if (after) after();
}
let lastRoute = "";
addEventListener("hashchange", () => {
  if (location.hash === "#bags") { history.replaceState(null, "", "#/"); render().then(() => { const el = document.getElementById("bags"); if (el) el.scrollIntoView({ behavior: "smooth" }); }); return; }
  const r = location.hash.split("/").slice(0, 2).join("/"); if (r !== lastRoute) scrollTo(0, 0); lastRoute = r; render();
});
(async () => {
  render();
  try { const { data } = await withTimeout(sb.auth.getSession(), 8000); await onSession(data.session); } catch (e) { console.error(e); await onSession(null); }
  S.ready = true; lastUid = S.user && S.user.id;
  const h = location.hash;
  if (S.user && (/access_token|refresh_token|type=magiclink|type=signup/.test(h) || h.startsWith("#/login"))) { toast(L("تم الدخول، أهلًا بك","You’re signed in. Welcome!")); goNext(); }
  else if (/access_token|error_description/.test(h)) { history.replaceState(null, "", location.pathname + "#/"); if (/error_description/.test(h)) toast(L("انتهت صلاحية رابط الدخول، اطلب رمزًا جديدًا","The sign-in link expired; request a new code")); render(); }
  else render();
  // لا ننتظر أي طلب داخل مستمع الدخول نفسه (يسبب تجمّد المكتبة)، بل نؤجله
  sb.auth.onAuthStateChange((ev, session) => {
    const uid = session && session.user && session.user.id;
    if (uid === lastUid) return;
    setTimeout(async () => { if (uid) await afterSignIn(session); else { lastUid = null; await onSession(null); render(); } }, 0);
  });
})();
