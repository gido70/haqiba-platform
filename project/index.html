.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:16px;margin:6px 0}

    { t: "السجل", items: [
      { h: "هوية «الحقيبة» في النموذج", d: "17 أكتوبر 2026", st: "done", b: "<p>شعار حقيبة جلدية بخياطة، وألوان وخطوط جديدة، ورسم حقيبة مفتوحة في الواجهة، والكتالوج مقسّم مجموعات (مجموعة مسار أولها)، والأكواد بادئة جديدة، والوضع الليلي. فُحص على الحاسوب والهاتف.</p>" },
      { h: "النموذج المرئي الأول للمنصة", d: "17 أكتوبر 2026", st: "done", b: "<p>صفحة واحدة تفاعلية: الكتالوج، وصفحة هبوط حقيبة الفيديو، والدخول برمز، والتفعيل بكود، وحقائبي، والمشغّل (الفيديو والملف والامتحان ونص الدرس) بقفل الوحدات، والامتحانات الست الحقيقية، والشهادة المولّدة على القالب الحقيقي برقم تحقق، وصفحة التحقق، ولوحة المدرب (نظرة عامة، والمتدربون، ومنح الوصول والأكواد، وإعدادات الامتحانات). فُحصت على الحاسوب والهاتف.</p>" },
      { h: "الإندكس صفحة منشورة", d: "17 أكتوبر 2026", st: "done", b: "<p>بطلب صاحب المشروع: تحويل الإندكس من ملف نصي إلى صفحة مرئية بتصميم مسار، ونشرها صفحةً خاصة، وحفظ مصدرها في المستودع.</p>" },
      { h: "إنشاء الإندكس وحفظ وثيقة المتطلبات", d: "17 أكتوبر 2026", st: "done", b: "<p>في المستودع الخاص، مع فحص خلو الملفات من المفتاح.</p>" },
      { h: "المستودع الخاص ومفتاحه", d: "17 أكتوبر 2026", st: "done", b: "<p>مفتاح بصلاحية قراءة الملفات وكتابتها، محصور في هذا المستودع. فُحص: لا يصل إلى مستودع مسار.</p>" },
      { h: "اعتماد وثيقة المتطلبات والقرارات الثلاثة", d: "17 أكتوبر 2026", st: "done", b: "<p>حالات الوصول الثلاث، والمعمار (أ) بمشروع سوبابيس جديد، وحقيبة الفيديو أولًا.</p>" },
      { h: "قراءة مصادر مسار وكتابة الوثيقة", d: "17 أكتوبر 2026", st: "done", b: "<p>الإندكس، ومواصفات CPS، والمنهجية، وملف البيانات، ومراجعة أسعار الخدمات.</p>" }
    ]}
  ]
};

const $ = id => document.getElementById(id);
$("ver").textContent = "الإصدار " + IDX.version + " · آخر تحديث: " + IDX.updated;
$("nowT").textContent = IDX.now.title;
$("nowD").innerHTML = IDX.now.detail;
$("resume").innerHTML = IDX.resume;
$("road").innerHTML = IDX.road.map(r => '<div class="' + (r.s === "done" ? "done" : r.s === "now" ? "cur" : "") + '"><i>' + r.n + (r.s === "done" ? " ✓" : r.s === "now" ? " ◀ الآن" : "") + '</i><b>' + r.t + '</b></div>').join("");
const ST = { done: ["منجز","b-done"], now: ["جارٍ","b-now"], next: ["قادم","b-next"] };
let tab = 0, open = false;
function draw(){
  $("tabs").innerHTML = IDX.tabs.map((t,i) => '<button type="button" data-i="' + i + '" class="' + (i === tab ? "on" : "") + '">' + t.t + ' (' + t.items.length + ')</button>').join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = +b.dataset.i; $("q").value = ""; draw(); });
  const q = $("q").value.trim();
  const pool = q ? IDX.tabs.flatMap(t => t.items.map(x => Object.assign({ tab: t.t }, x))) : IDX.tabs[tab].items;
  const items = pool.filter(x => !q || (x.h + x.b).includes(q));
  $("list").innerHTML = items.length ? items.map(x => '<details class="item"' + (open ? " open" : "") + '><summary>' + x.h + (x.st ? '<span class="badge ' + ST[x.st][1] + '">' + ST[x.st][0] + '</span>' : "") + '<span class="d">' + (x.tab ? x.tab + " · " : "") + (x.d || "") + '</span></summary><div class="body">' + x.b + '</div></details>').join("") : '<div class="empty">لا نتائج.</div>';
}
$("q").oninput = draw;
$("openAll").onclick = () => { open = !open; $("openAll").textContent = open ? "إغلاق الكل" : "فتح الكل"; draw(); };
draw();
</script>
</body>
</html>
